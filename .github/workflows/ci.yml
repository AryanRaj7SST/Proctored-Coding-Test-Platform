name: CI

# Mirrors scripts/validate-stack.sh's loops 1-3 plus the runner's own test
# suite, using services GitHub Actions can provide for free (Postgres) and
# skipping what genuinely needs secrets this repo does not have (Google OAuth
# credentials, a live runner container for e2e). See docs/deployment.md for
# what a merge to main additionally needs to actually deploy.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App — typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coding_platform_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d coding_platform_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coding_platform_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/coding_platform_ci?schema=public
      AUTH_SECRET: ci-only-secret-not-used-for-anything-real
      AUTH_GOOGLE_ID: ci-placeholder
      AUTH_GOOGLE_SECRET: ci-placeholder
      RUNNER_URL: http://localhost:4000
      RUNNER_SECRET: ci-only-runner-secret-at-least-16-chars
      AUTH_TRUST_HOST: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Prisma generate + migrate
        run: |
          npx prisma generate
          npm run db:deploy

      - name: Integration tests
        run: npm run test:integration

      - name: Seed (smoke check that the seed script itself runs)
        run: npm run db:seed

      - name: Production build
        run: npm run build

      - name: Offline verification (structure + import hygiene)
        run: npm run verify:offline

  runner:
    name: Runner — typecheck + unit tests + image build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runner/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (tsc)
        run: npm run build

      - name: Build the runner Docker image
        working-directory: .
        run: docker build -f runner/Dockerfile -t proctored-runner:ci .

  e2e-public:
    name: E2E — unauthenticated tier
    runs-on: ubuntu-latest
    needs: [app]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coding_platform_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d coding_platform_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coding_platform_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/coding_platform_ci?schema=public
      AUTH_SECRET: ci-only-secret-not-used-for-anything-real
      AUTH_GOOGLE_ID: ci-placeholder
      AUTH_GOOGLE_SECRET: ci-placeholder
      RUNNER_URL: http://localhost:4000
      RUNNER_SECRET: ci-only-runner-secret-at-least-16-chars
      AUTH_TRUST_HOST: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prisma generate + migrate
        run: |
          npx prisma generate
          npm run db:deploy

      - name: Build the app
        run: npm run build

      # Only the tier that needs no Google sign-in -- see tests/e2e/README.md
      # for why the authenticated tier cannot run unattended in CI either.
      - name: Run public e2e tests
        run: npx playwright test tests/e2e/public.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
