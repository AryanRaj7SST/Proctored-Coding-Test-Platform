# Local development stack: PostgreSQL + the isolated test runner.
# The Next.js app runs on the host (`npm run dev`) against these services.
services:
  db:
    image: postgres:16-alpine
    container_name: coding-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coding_platform
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d coding_platform']
      interval: 5s
      timeout: 5s
      retries: 10

  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    image: proctored-runner:latest
    container_name: coding-platform-runner
    restart: unless-stopped
    environment:
      PORT: '4000'
      # MUST match RUNNER_SECRET in the app's .env
      RUNNER_SECRET: ${RUNNER_SECRET:?RUNNER_SECRET must be set}
      RUNNER_ISOLATION: 'container'
      RUNNER_MAX_CONCURRENCY: '4'
      RUNNER_MAX_QUEUE: '64'
      RUN_TIMEOUT_MS: '20000'
      TEST_TIMEOUT_MS: '6000'
      LOG_LEVEL: 'info'
      # Chromium's own sandbox needs unprivileged user namespaces. On hosts
      # where those are disabled, set this to "true" -- the container itself is
      # then the isolation boundary (see docs/security.md).
      RUNNER_CHROMIUM_NO_SANDBOX: ${RUNNER_CHROMIUM_NO_SANDBOX:-false}
    ports:
      - '127.0.0.1:4000:4000'
    # Hard resource ceilings. The runner holds NO database URL, NO OAuth
    # credentials and NO application secrets -- only RUNNER_SECRET.
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m
      - /dev/shm:rw,nosuid,size=512m
      - /home/pwuser:rw,nosuid,size=128m
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
